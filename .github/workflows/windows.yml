name: Windows doğrulaması
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Kurulum aracını hazırla
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup kurulamadı' }
          }
      - name: Test et ve taşınabilir paket oluştur
        shell: pwsh
        run: ./scripts/Publish.ps1 -Runtime ${{ matrix.runtime }}
      - name: x64 yerinde güncelleme ve yeniden açılış testi
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./scripts/Test-Upgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Viewer-${{ matrix.runtime }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/V')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm numarasını doğrula
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PdfViewer/PdfViewer.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_NAME -ne "V$version") { throw 'Etiket ve uygulama sürümü eşleşmiyor' }
      - uses: actions/download-artifact@v4
        with:
          pattern: PDF-Viewer-*
          path: release-files
          merge-multiple: true
      - name: Kurulum dosyalarını yayımla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem ./release-files/*.exe | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --title "PDF Viewer $env:GITHUB_REF_NAME" --notes-file docs/SURUM-NOTLARI.md --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { throw 'Sürüm yayımlanamadı' }
