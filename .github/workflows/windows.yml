name: Windows doğrulaması
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Kurulum aracını hazırla
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup kurulamadı' }
          }
      - name: Test et ve taşınabilir paket oluştur
        shell: pwsh
        run: ./scripts/Publish.ps1 -Runtime ${{ matrix.runtime }}
      - name: x64 kurulumunu ve pencere açılışını doğrula
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'PDF Viewer Test'
          $setup = Start-Process ./artifacts/PDF-Viewer-Setup-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Kurulum başarısız: $($setup.ExitCode)" }
          $app = Start-Process "$installDir/PdfViewer.exe" -PassThru
          try {
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) { throw "Uygulama erken kapandı: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'Uygulama penceresi oluşmadı' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Viewer-${{ matrix.runtime }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
